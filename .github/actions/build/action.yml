name: Build
description: Build using CMake

inputs:
  build-type:
    description: Build type
    required: false
    default: Release

  upload-artifact:
    description: Whether to upload artifacts or not
    required: false
    default: false

runs:
  using: composite
  steps:
    - name: Get CPM cache
      id: get-cpm-cache
      uses: actions/cache/restore@v6 # zizmor: ignore[unpinned-uses]
      with:
        path: ./.cpm-cache
        key: ${{ runner.os }}-cpm-cache-${{ inputs.build-type }}

    - name: Setup sccache
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: ${{ runner.os }}-sccache-${{ inputs.build-type }}
        variant: sccache

    - name: Generate build folder
      id: generate-build-folder
      shell: bash
      run: |
        cmake -B build . \
        -DCMAKE_BUILD_TYPE=${INPUTS_BUILD_TYPE} \
        -DCPM_SOURCE_CACHE=./.cpm-cache \
        -G "Ninja" \
        -DCMAKE_C_COMPILER=clang \
        -DCMAKE_CXX_COMPILER=clang++ \
        -DCMAKE_C_COMPILER_LAUNCHER=sccache \
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      env:
        INPUTS_BUILD_TYPE: ${{ inputs.build-type }}

    - name: Get CPU cores
      id: cpu-cores
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "cpu_cores=$NUMBER_OF_PROCESSORS" >> $GITHUB_OUTPUT
        else
          echo "cpu_cores=$(nproc --all)" >> $GITHUB_OUTPUT
        fi

    - name: Build project
      id: build-project
      shell: bash
      # Have to use --config on build step due to Windows
      run: |
        cmake --build build --config ${INPUTS_BUILD_TYPE} -j${CPU_CORES}
      env:
        INPUTS_BUILD_TYPE: ${{ inputs.build-type }}
        CPU_CORES: ${{ steps.cpu-cores.outputs.cpu_cores }}

    - name: Save CPM cache
      id: save-cpm-cache
      uses: actions/cache/save@v6 # zizmor: ignore[unpinned-uses]
      with:
        path: ./.cpm-cache
        key: ${{ runner.os }}-cpm-cache-${{ inputs.build-type }}

      # Lowercase the runner OS var
      # This is mostly for the styling of the artifacts
    - name: Get runner OS var
      id: runner-os-var
      if: "${{ inputs.upload-artifact == 'true' }}"
      shell: bash
      run: echo "runner_os=${RUNNER_OS,,}" >> $GITHUB_OUTPUT

    - name: Prepare artifact
      id: prepare-artifact
      if: "${{ inputs.upload-artifact == 'true' }}"
      shell: bash
      run: |
        FOLDER_NAME="freakytd-${RUNNER_OS_LOWER}"
        mkdir $FOLDER_NAME

        if [ "$RUNNER_OS" = "Windows" ]; then
          cp build/server/freakytd.exe $FOLDER_NAME
        else
          cp build/server/freakytd $FOLDER_NAME
        fi
      env:
        INPUTS_BUILD_TYPE: ${{ inputs.build-type }}
        RUNNER_OS_LOWER: ${{ steps.runner-os-var.outputs.runner_os }}

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: "${{ inputs.upload-artifact == 'true' }}"
      with:
        name: freakytd-${{ steps.runner-os-var.outputs.runner_os }}
        path: ./freakytd-${{ steps.runner-os-var.outputs.runner_os }}
        retention-days: 3
