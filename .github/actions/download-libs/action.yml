name: Download libraries
description: Download all required libraries for graphical display

runs:
  using: composite
  steps:
    - name: Download libraries
      id: download-libraries
      if: "${{ runner.os == 'Linux' }}"
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install \
          xorg-dev \
          libharfbuzz-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxi-dev \
          libudev-dev \
          libflac-dev \
          libvorbis-dev
